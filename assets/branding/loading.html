<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git UI Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /*
    Git UI loading screen, inspired by "Tangling with Git Branches": hand-drawn branches tangle,
    pruning shears cut the knot, the branches settle into a clean graph and the logo appears.
    Lasts at least 5 seconds (see GitUiSplash below).
  */
  :root {
    --paper: #1c1e23;
    --ink: #f2f2f2;
    --muted: rgba(242, 242, 242, .6);
    --track: rgba(255, 255, 255, .1);
    --accent: #15a0bf;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --paper: #ffffff; --ink: #111111; --muted: rgba(0, 0, 0, .55); --track: rgba(0, 0, 0, .08); }
  }
  :root[data-theme="light"] { --paper: #ffffff; --ink: #111111; --muted: rgba(0, 0, 0, .55); --track: rgba(0, 0, 0, .08); }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity .45s ease;
  }
  body.leaving { opacity: 0; }

  .stage { position: relative; width: min(1100px, 100vw - 32px); aspect-ratio: 1200 / 640; }
  .stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  /* ink line art */
  .ink { stroke: var(--ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .node { fill: var(--paper); stroke: var(--ink); stroke-width: 4; }
  .label rect { fill: var(--paper); stroke: var(--ink); stroke-width: 3.5; }
  .label text { fill: var(--ink); font-family: "Patrick Hand", "Segoe Print", cursive; font-size: 24px; }
  .shears { color: var(--ink); --logo-paper: var(--paper); }

  /* final lockup */
  .lockup {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.92);
    display: flex; align-items: center; gap: 18px;
    opacity: 0; pointer-events: none;
    background: var(--paper);
    padding: 18px 28px; border-radius: 22px;
    box-shadow: 0 0 0 1px var(--track), 0 18px 60px rgba(0, 0, 0, .25);
    color: var(--ink); --logo-paper: var(--paper);
  }
  .lockup svg { width: 92px; height: 92px; }
  .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .wordmark b { font-size: 52px; font-weight: 800; letter-spacing: -1.5px; }
  .wordmark b span { color: var(--accent); }
  .wordmark small { font-family: "Patrick Hand", "Segoe Print", cursive; font-size: 21px; color: var(--muted); margin-top: 6px; }

  .status { width: min(420px, 100vw - 32px); margin-top: 18px; text-align: center; }
  .status .message { font-size: 13px; color: var(--muted); height: 18px; transition: opacity .25s; }
  .bar { margin-top: 10px; height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; border-radius: 4px; background: var(--accent); }
  .bar.waiting i { width: 35% !important; animation: shimmer 1.1s ease-in-out infinite; }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(290%); } }

  .replay {
    margin-top: 16px; font: inherit; font-size: 12px; color: var(--muted);
    background: none; border: 1px solid var(--track); border-radius: 999px; padding: 6px 14px; cursor: pointer;
    opacity: 0; transition: opacity .3s;
  }
  .replay.visible { opacity: 1; }
</style>
</head>
<body>
  <div class="stage" role="img" aria-label="Loading Git UI: tangled branches are pruned into a clean graph">
    <svg id="scene" viewBox="0 0 1200 640" aria-hidden="true">
      <defs>
        <!-- wobbly, hand-drawn stroke like the reference illustration -->
        <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" />
        </filter>
        <symbol id="mark" viewBox="0 0 512 512">
          <g transform="translate(-34 4)">
            <g stroke="currentColor" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="var(--logo-paper, #fff)">
              <path d="M 262 236 C 236 236 214 250 206 270 C 186 316 150 362 108 414 C 90 436 104 466 130 456 C 178 420 224 366 252 316 C 264 294 276 276 292 266 Z" />
              <path d="M 316 262 C 330 280 332 300 320 322 C 302 360 290 404 280 446 C 274 474 302 484 312 458 C 330 410 352 362 362 318 C 368 290 360 268 344 254 Z" />
              <path d="M 264 292 L 300 312" stroke-width="22" fill="none" />
              <path d="M 272 216 C 262 150 300 80 390 46 C 404 40 412 52 404 64 C 372 110 350 160 334 214 Z" />
              <path d="M 318 254 C 360 236 408 206 454 170 C 466 162 478 172 470 184 C 446 232 400 262 340 272 Z" />
              <circle cx="304" cy="232" r="34" />
              <circle cx="304" cy="232" r="13" fill="currentColor" stroke="none" />
            </g>
            <g transform="translate(18 -34) rotate(-18 432 360)" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
              <path d="M 392 318 L 432 360 L 470 344" />
              <path d="M 432 360 L 440 410" />
              <path d="M 384 306 L 396 322" stroke-dasharray="2 14" />
              <circle cx="470" cy="344" r="13" fill="var(--logo-paper, #fff)" />
              <circle cx="440" cy="410" r="13" fill="var(--logo-paper, #fff)" />
            </g>
          </g>
        </symbol>
      </defs>

      <g id="tangle" filter="url(#sketch)"></g>
      <g id="clean"></g>
      <g id="twigs" filter="url(#sketch)"></g>

      <!-- Shears: the two halves rotate around the pivot to snip. Pivot at (304, 232) in mark space. -->
      <g id="shears" class="shears" opacity="0">
        <g id="shears-inner" transform="translate(800 330) rotate(-135) scale(.6) translate(-304 -232)">
          <g id="half-a" stroke="currentColor" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="var(--logo-paper)">
            <!-- snip: rotate around the pivot (304, 232) in the shears' own coordinates -->
            <animateTransform id="snip-a" attributeName="transform" type="rotate" begin="indefinite" dur="0.9s"
              values="0 304 232; -14 304 232; 0 304 232; -12 304 232; 0 304 232" keyTimes="0; .3; .55; .75; 1"
              calcMode="spline" keySplines=".4 0 .6 1; .4 0 .6 1; .4 0 .6 1; .4 0 .6 1" />
            <path d="M 262 236 C 236 236 214 250 206 270 C 186 316 150 362 108 414 C 90 436 104 466 130 456 C 178 420 224 366 252 316 C 264 294 276 276 292 266 Z" />
            <path d="M 318 254 C 360 236 408 206 454 170 C 466 162 478 172 470 184 C 446 232 400 262 340 272 Z" />
          </g>
          <g id="half-b" stroke="currentColor" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="var(--logo-paper)">
            <animateTransform id="snip-b" attributeName="transform" type="rotate" begin="indefinite" dur="0.9s"
              values="0 304 232; 14 304 232; 0 304 232; 12 304 232; 0 304 232" keyTimes="0; .3; .55; .75; 1"
              calcMode="spline" keySplines=".4 0 .6 1; .4 0 .6 1; .4 0 .6 1; .4 0 .6 1" />
            <path d="M 316 262 C 330 280 332 300 320 322 C 302 360 290 404 280 446 C 274 474 302 484 312 458 C 330 410 352 362 362 318 C 368 290 360 268 344 254 Z" />
            <path d="M 272 216 C 262 150 300 80 390 46 C 404 40 412 52 404 64 C 372 110 350 160 334 214 Z" />
          </g>
          <g stroke="currentColor" stroke-width="14" fill="var(--logo-paper)">
            <circle cx="304" cy="232" r="34" />
            <circle cx="304" cy="232" r="13" fill="currentColor" stroke="none" />
          </g>
        </g>
      </g>

      <!-- snip spark -->
      <g id="spark" class="ink" stroke-width="5" opacity="0" transform="translate(700 300)">
        <path d="M 0 -34 L 0 -16 M 0 16 L 0 34 M -34 0 L -16 0 M 16 0 L 34 0 M -24 -24 L -12 -12 M 12 12 L 24 24 M -24 24 L -12 12 M 12 -12 L 24 -24" />
      </g>
    </svg>

    <div class="lockup" id="lockup">
      <svg role="img" aria-label="Git UI"><use href="#mark" /></svg>
      <div class="wordmark"><b>Git<span>UI</span></b><small>untangle your branches</small></div>
    </div>
  </div>

  <div class="status">
    <div class="message" id="message" aria-live="polite">Reading refs…</div>
    <div class="bar" id="bar"><i id="progress"></i></div>
    <button class="replay" id="replay" type="button">Replay</button>
  </div>

<script>
(() => {
  "use strict";

  const MINIMUM_MS = 5000;
  const SVG_NS = "http://www.w3.org/2000/svg";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Branch names from the reference illustration.
  const BRANCHES = ["main", "feature/login", "bugfix/typo", "feature/ui", "hotfix/1.2.3", "release/v1.2", "dev"];
  const LANE_COLORS = ["#15a0bf", "#0669f7", "#8e00c2", "#c517b6", "#d90171", "#f25d2e", "#2ece9d"];

  const scene = document.getElementById("scene");
  const tangle = document.getElementById("tangle");
  const clean = document.getElementById("clean");
  const twigs = document.getElementById("twigs");
  const shears = document.getElementById("shears");
  const spark = document.getElementById("spark");
  const lockup = document.getElementById("lockup");
  const message = document.getElementById("message");
  const progress = document.getElementById("progress");
  const bar = document.getElementById("bar");
  const replay = document.getElementById("replay");

  // Small seeded random generator: the tangle looks organic but is identical on every run.
  function rng(seed) {
    return () => {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    };
  }

  function el(name, attrs, parent) {
    const node = document.createElementNS(SVG_NS, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (parent) parent.appendChild(node);
    return node;
  }

  function label(parent, x, y, text, color) {
    // The position lives on an outer group: animations set a CSS transform on the inner one,
    // which would otherwise replace the translate().
    const outer = el("g", { transform: `translate(${x} ${y})` }, parent);
    const group = el("g", { class: "label" }, outer);
    const width = 22 + text.length * 11.5 + (color ? 20 : 0);
    el("rect", { x: -width / 2, y: -19, width, height: 38, rx: 10 }, group);
    if (color) el("circle", { cx: -width / 2 + 14, cy: 0, r: 5, fill: color, stroke: "none" }, group);
    const t = el("text", { x: color ? 10 : 0, y: 8, "text-anchor": "middle" }, group);
    t.textContent = text;
    return group;
  }

  /** Draws a stroke progressively, like a pen. */
  function drawIn(path, delay, duration) {
    const length = path.getTotalLength();
    path.style.strokeDasharray = `${length}`;
    path.style.strokeDashoffset = `${length}`;
    return path.animate([{ strokeDashoffset: length }, { strokeDashoffset: 0 }],
      { delay, duration, easing: "cubic-bezier(.45,.05,.3,1)", fill: "forwards" });
  }

  function pop(node, delay, duration = 260) {
    node.style.transformBox = "fill-box";
    node.style.transformOrigin = "center";
    return node.animate([{ opacity: 0, transform: "scale(.2)" }, { opacity: 1, transform: "scale(1.12)", offset: .7 }, { opacity: 1, transform: "scale(1)" }],
      { delay, duration, easing: "ease-out", fill: "both" });
  }

  // ---------- Scene 1: the tangle ----------
  function buildTangle() {
    tangle.replaceChildren();
    const random = rng(42);
    const anchors = [
      [210, 120], [540, 70], [150, 230], [130, 350], [150, 470], [250, 580], [600, 600],
    ];
    const strands = [];
    anchors.forEach(([x, y], i) => {
      // From the label, loop through the knot (centre), and end where the hands pull (right).
      const pts = [[x + 70 * Math.sign(600 - x), y + (y < 320 ? 30 : -30)]];
      for (let k = 0; k < 4; k++) pts.push([360 + random() * 420, 170 + random() * 300]);
      pts.push([760 + random() * 70, 240 + random() * 140]);
      let d = `M ${pts[0][0]} ${pts[0][1]}`;
      for (let k = 1; k < pts.length; k++) {
        const [px, py] = pts[k - 1];
        const [cx, cy] = pts[k];
        const bend = (random() - .5) * 220;
        d += ` C ${px + bend} ${py - bend}, ${cx - bend} ${cy + bend}, ${cx} ${cy}`;
      }
      const path = el("path", { d, class: "ink", "stroke-width": 4.5 }, tangle);
      strands.push(path);

      // Extra stubs that sprout and end on a commit, like the loose ends in the illustration.
      if (i % 2 === 0) {
        const len = path.getTotalLength();
        const p = path.getPointAtLength(len * (.3 + random() * .3));
        const ex = p.x + (random() - .5) * 140, ey = p.y + (random() - .5) * 140;
        const stub = el("path", { d: `M ${p.x} ${p.y} Q ${(p.x + ex) / 2 + 30} ${(p.y + ey) / 2 - 30} ${ex} ${ey}`, class: "ink", "stroke-width": 4 }, tangle);
        strands.push(stub);
      }
    });

    const nodes = [];
    strands.forEach((path, i) => {
      const len = path.getTotalLength();
      const count = path.getAttribute("stroke-width") === "4" ? 1 : 3;
      for (let k = 1; k <= count; k++) {
        const p = path.getPointAtLength(count === 1 ? len : len * k / (count + 1));
        nodes.push({ node: el("circle", { cx: p.x, cy: p.y, r: 9, class: "node" }, tangle), strand: i, order: k / (count + 1) });
      }
    });

    const labels = anchors.map(([x, y], i) => label(tangle, x, y, BRANCHES[i]));
    return { strands, nodes, labels };
  }

  // ---------- Scene 3: the clean graph ----------
  function buildClean() {
    clean.replaceChildren();
    const laneY = (i) => 140 + i * 62;
    const left = 330, right = 1010;
    const parts = [];
    BRANCHES.forEach((name, i) => {
      const color = LANE_COLORS[i];
      const y = laneY(i);
      // Every branch forks from main (lane 0) and the first ones merge back: a readable graph.
      const fork = left + 30 + i * 58;
      // The first branches merge back into main; the later ones are still open, so their lane
      // simply ends — always well after the fork, never before it.
      const merges = i <= 3;
      const merge = merges ? right - 40 - i * 62 : Math.max(fork + 220, right - 150 - (i - 4) * 70);
      let d;
      if (i === 0) {
        d = `M ${left} ${y} L ${right} ${y}`;
      } else {
        d = `M ${fork - 40} ${laneY(0)} C ${fork - 10} ${laneY(0)}, ${fork - 10} ${y}, ${fork + 20} ${y} L ${merge - 20} ${y}`;
        if (merges) d += ` C ${merge + 10} ${y}, ${merge + 10} ${laneY(0)}, ${merge + 40} ${laneY(0)}`;
      }
      const path = el("path", { d, fill: "none", stroke: color, "stroke-width": 5, "stroke-linecap": "round" }, clean);
      const commits = [];
      const start = i === 0 ? left + 30 : fork + 50;
      const end = i === 0 ? right - 20 : merge - 30;
      for (let x = start; x <= end; x += 92) {
        commits.push(el("circle", { cx: x + (i % 2) * 24, cy: y, r: 9, fill: "var(--paper)", stroke: color, "stroke-width": 5 }, clean));
      }
      const tag = label(clean, 205, y, name, color);
      parts.push({ path, commits, tag });
    });
    clean.style.opacity = "0";
    return parts;
  }

  // ---------- Status ----------
  const MESSAGES = [
    [0, "Reading refs…"],
    [1100, "Following every branch…"],
    [2300, "Pruning the tangles…"],
    [3300, "Laying out the graph…"],
    [4500, "Ready"],
  ];
  let messageTimers = [];
  function scheduleMessages() {
    messageTimers.forEach(clearTimeout);
    messageTimers = MESSAGES.map(([at, text]) => setTimeout(() => {
      message.style.opacity = "0";
      setTimeout(() => { message.textContent = text; message.style.opacity = "1"; }, 140);
    }, at));
  }

  // ---------- Timeline ----------
  let animations = [];
  function track(animation) { animations.push(animation); return animation; }

  function play() {
    animations.forEach(a => a.cancel());
    animations = [];
    replay.classList.remove("visible");
    bar.classList.remove("waiting");
    lockup.style.opacity = "0";
    twigs.replaceChildren();

    const { strands, nodes, labels } = buildTangle();
    const lanes = buildClean();
    scheduleMessages();
    track(progress.animate([{ width: "0%" }, { width: "38%", offset: .35 }, { width: "62%", offset: .6 }, { width: "86%", offset: .85 }, { width: "100%" }],
      { duration: MINIMUM_MS, easing: "linear", fill: "forwards" }));

    if (reduceMotion) {
      tangle.style.opacity = "0";
      clean.style.opacity = "1";
      track(lockup.animate([{ opacity: 0 }, { opacity: 1 }], { delay: 300, duration: 400, fill: "forwards" }));
      return;
    }

    tangle.style.opacity = "1";
    tangle.style.display = "";
    tangle.style.transform = "";

    // 0 – 1.8 s: the branches draw themselves and tangle.
    labels.forEach((l, i) => track(pop(l, 80 + i * 90)));
    strands.forEach((s, i) => track(drawIn(s, 150 + i * 70, 1150)));
    nodes.forEach(({ node, strand, order }) => track(pop(node, 150 + strand * 70 + 1150 * order, 220)));

    // 1.2 – 2.3 s: the knot strains, like hands pulling on it.
    tangle.style.transformBox = "view-box";
    tangle.style.transformOrigin = "600px 330px";
    track(tangle.animate([
      { transform: "translate(0,0) rotate(0deg)" }, { transform: "translate(6px,-3px) rotate(.6deg)" },
      { transform: "translate(-5px,4px) rotate(-.5deg)" }, { transform: "translate(4px,2px) rotate(.4deg)" },
      { transform: "translate(0,0) rotate(0deg)" },
    ], { delay: 1200, duration: 1100, easing: "ease-in-out" }));

    // 1.9 s: the shears come in.
    track(shears.animate([
      { opacity: 0, transform: "translate(380px, -40px) rotate(18deg)" },
      { opacity: 1, transform: "translate(0, 0) rotate(0deg)" },
    ], { delay: 1850, duration: 520, easing: "cubic-bezier(.2,.9,.25,1.1)", fill: "both" }));

    // 2.25 – 3.15 s: two snips — the halves swing open and shut around the pivot (304, 232).
    // SMIL animateTransform rotates around a point in the halves' own coordinates, which a CSS
    // transform-origin cannot do reliably inside a transformed group.
    const snips = [document.getElementById("snip-a"), document.getElementById("snip-b")];
    snips.forEach(s => { s.endElement(); s.beginElementAt(2.25); });
    track({ cancel() { snips.forEach(s => s.endElement()); } });
    // a spark where the blades meet, on each cut
    [2520, 2950].forEach((at, i) => track(spark.animate([
      { opacity: 0, transform: `translate(${688 - i * 14}px, ${318 + i * 18}px) scale(.4)` },
      { opacity: 1, transform: `translate(${688 - i * 14}px, ${318 + i * 18}px) scale(1.1)`, offset: .4 },
      { opacity: 0, transform: `translate(${688 - i * 14}px, ${318 + i * 18}px) scale(1.4)` },
    ], { delay: at, duration: 320, easing: "ease-out" })));

    // 2.5 – 3.3 s: cut pieces fall away; the tangle lets go.
    const random = rng(7);
    for (let i = 0; i < 9; i++) {
      const x = 560 + random() * 180, y = 250 + random() * 150;
      const twig = el("g", {}, twigs);
      el("path", { d: `M ${x} ${y} q ${20 + random() * 30} ${-20 + random() * 40} ${50 + random() * 30} ${random() * 30}`, class: "ink", "stroke-width": 4.5 }, twig);
      el("circle", { cx: x, cy: y, r: 8, class: "node" }, twig);
      twig.style.opacity = "0";
      track(twig.animate([
        { opacity: 1, transform: "translate(0,0) rotate(0deg)" },
        { opacity: 0, transform: `translate(${(random() - .5) * 120}px, ${180 + random() * 140}px) rotate(${(random() - .5) * 140}deg)` },
      ], { delay: 2550 + i * 70, duration: 900, easing: "cubic-bezier(.4,0,.8,.6)", fill: "both" })).onfinish = () => twig.remove();
    }
    // Hidden for good once faded: an invisible group under an SVG filter can leave a stray pixel.
    track(tangle.animate([{ opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(3px)" }],
      { delay: 2700, duration: 650, easing: "ease-in", fill: "forwards" })).onfinish = () => { tangle.style.display = "none"; };
    track(shears.animate([{ opacity: 1, transform: "translate(0,0) scale(1)" }, { opacity: 0, transform: "translate(60px,-30px) scale(.85)" }],
      { delay: 3250, duration: 450, easing: "ease-in", fill: "forwards" }));

    // 3.2 – 4.4 s: the branches settle into clean, colored lanes.
    clean.style.opacity = "1";
    lanes.forEach(({ path, commits, tag }, i) => {
      track(drawIn(path, 3200 + i * 80, 700));
      track(pop(tag, 3200 + i * 80, 320));
      commits.forEach((c, k) => track(pop(c, 3500 + i * 80 + k * 45, 220)));
    });

    // 4.3 – 5 s: the logo lands over a dimmed graph.
    track(clean.animate([{ opacity: 1 }, { opacity: .22 }], { delay: 4300, duration: 500, fill: "forwards" }));
    track(lockup.animate([
      { opacity: 0, transform: "translate(-50%, -46%) scale(.86)" },
      { opacity: 1, transform: "translate(-50%, -50%) scale(1)" },
    ], { delay: 4300, duration: 600, easing: "cubic-bezier(.2,.9,.25,1.15)", fill: "forwards" }));
  }

  // ---------- Host API: never finish before MINIMUM_MS ----------
  // Embedded in the app, call GitUiSplash.markReady() once the repository is loaded; the screen
  // then leaves as soon as the 5-second minimum is reached. Opened directly in a browser (no
  // "?wait" in the URL) it marks itself ready and offers a replay.
  let startedAt = performance.now();
  let ready = false;
  let finished = false;
  let resolveDone;
  const done = new Promise(r => { resolveDone = r; });
  const standalone = !new URLSearchParams(location.search).has("wait");

  function maybeFinish() {
    if (finished || !ready) return;
    const remaining = MINIMUM_MS - (performance.now() - startedAt);
    if (remaining > 0) { setTimeout(maybeFinish, remaining); return; }
    finished = true;
    bar.classList.remove("waiting");
    if (standalone) {
      replay.classList.add("visible");
    } else {
      document.body.classList.add("leaving");
      setTimeout(() => window.dispatchEvent(new CustomEvent("gitui:splash-done")), 450);
    }
    resolveDone();
  }

  // Still loading after 5 s: keep an indeterminate bar instead of a frozen 100 %.
  setTimeout(() => { if (!ready) { bar.classList.add("waiting"); message.textContent = "Still loading…"; } }, MINIMUM_MS + 50);

  window.GitUiSplash = {
    minimumMs: MINIMUM_MS,
    markReady() { ready = true; maybeFinish(); },
    done,
  };

  replay.addEventListener("click", () => {
    startedAt = performance.now();
    finished = false;
    play();
    setTimeout(() => replay.classList.add("visible"), MINIMUM_MS);
  });

  play();
  if (standalone) window.GitUiSplash.markReady();
})();
</script>
</body>
</html>
